[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devlog-cli"
version = "0.1.0"
description = "A lightweight command-line tool for managing development notes."
requires-python = ">=3.10"

[project.scripts]
devlog = "devlog.cli:main"

[tool.setuptools.packages.find]
include = ["devlog*"]